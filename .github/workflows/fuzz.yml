name: Fuzz

# The fuzz targets, given real time.
#
# Every "go test" run already executes each target's seed corpus, so a defect one
# of the seeds reaches fails the ordinary build. What this adds is the search:
# ten minutes per package finds inputs nobody wrote down, which is the whole point
# of a fuzzer and is not something a pull request should wait for.
on:
  schedule:
    # Sundays, early.
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./paragraph
            target: FuzzBreakParagraph
          - package: ./paragraph
            target: FuzzSplitAtBreaks
          - package: ./paragraph
            target: FuzzBalance
          - package: ./css
            target: FuzzTokenize
          - package: ./css
            target: FuzzParse
          - package: ./css
            target: FuzzSelector
          - package: ./font
            target: FuzzCmapSubtable
          - package: ./font
            target: FuzzSFNTCmap
          - package: ./font
            target: FuzzParseCFF
          # The three the audit found missing. WOFF 1 and Type 1 had no target
          # at all, and the glyf transform had one only in name: FuzzDecodeWOFF2
          # reads a whole file, and the fixtures that carry a transformed glyf
          # are Brotli streams, so nearly every mutation breaks the compression
          # and the decoder stops before the transform is reached.
          - package: ./font
            target: FuzzDecodeWOFF
          - package: ./font
            target: FuzzWOFF2Glyf
          - package: ./font
            target: FuzzParseType1
          - package: ./shape
            target: FuzzLoadAndUse
          - package: ./layout
            target: FuzzImageLoading
          # The numbers a caller hands the line breaker, rather than the text:
          # an index into the items and a byte offset into one of them, which a
          # caller that computes its own can compute wrongly.
          - package: ./paragraph
            target: FuzzBreakerCursor
          # The whole pipeline, which is the one an embedder calls. Every target
          # above covers a reader; this covers what happens once all of their
          # answers have to agree with each other, and it is the only place where
          # a failure is the embedder's process rather than a value it can be
          # handed back.
          - package: ./layout
            target: FuzzRender
          # The algorithm every document with two directions in it goes through.
          # Its conformance suite settles what the answers are for the cases
          # Unicode tabulated; this settles that arbitrary text gets an answer at
          # all, and that the levels are a shape a caller can index by. It found
          # LineLevels contradicting Levels over a trailing PDF within an hour of
          # being written.
          - package: ./bidi
            target: FuzzResolve
          # Where a line may be cut, over bytes rather than over text. The
          # conformance files settle the boundaries for strings Unicode
          # tabulated; this settles that three APIs reading one string agree
          # about it — including a string that is not UTF-8, which is the half
          # nobody tabulated and the half a document actually arrives in.
          - package: ./segment
            target: FuzzBoundaries
          # Two walks over one paragraph, asked to agree. A box that shrink-wraps
          # its content is sized from the intrinsic widths, which a pass computes
          # without breaking a line; the lines are then filled by a different
          # walk with a different accounting, and nothing else says the two have
          # to arrive at the same number. They have not: a word split by a span
          # measured one way in each.
          - package: ./layout
            target: FuzzShrinkToFit
          # The two that hold CSS Text §8.1 at a box boundary, and between them
          # they have found twelve defects — more than every other target here
          # put together. Neither is reachable from a reftest: no document in
          # the suite writes a <span> in the middle of a Thai word or a bidi
          # control in a box of its own, which is the whole reason the defects
          # were there to find.
          #
          # They are a pair rather than one target twice. FuzzRunTiling lays
          # every case out under "white-space: nowrap" and compares the total
          # width, so nothing it does reaches a line edge; FuzzBoundaryLines
          # wraps and compares the lines, and found two defects in trimming and
          # in whether a line is empty that the first structurally cannot see.
          - package: ./layout
            target: FuzzRunTiling
          - package: ./layout
            target: FuzzBoundaryLines
          # And the third question the other two cannot ask. Both of those
          # compare two spellings of one document to each other, so a character
          # lost in both is a page they agree about; this compares the page to
          # the source.
          - package: ./layout
            target: FuzzDrawnText
          # The one bit in the property registry that decides what a document
          # looks like — a colour on <body> reaches every word under it and a
          # margin reaches nothing — asserted over a tree the parser built out
          # of whatever it was given, with no stylesheet to muddy the answer.
          - package: ./style
            target: FuzzInheritance
          # The parsers and decoders that read untrusted bytes, which were
          # missing from this list rather than excluded from it. html's
          # FuzzParse is the one that hid: css has a FuzzParse too, so the
          # repository's twenty-eight targets carry twenty-seven distinct
          # names, and a list that looked complete covered only one of the two.
          # TestEveryFuzzTargetIsScheduled will not let that happen again.
          - package: ./html
            target: FuzzParse
          - package: ./brotli
            target: FuzzDecode
          - package: ./font
            target: FuzzDecodeWOFF2
          - package: ./style
            target: FuzzApply
          - package: ./style
            target: FuzzApplyIsDeterministic
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Anchored, because -fuzz takes a regular expression and a target whose
      # name is a prefix of another matches both — which is not a slower run but
      # no run at all: "will not fuzz, -fuzz matches more than one fuzz test".
      # FuzzDecodeWOFF matched FuzzDecodeWOFF2 and had been fuzzing nothing.
      - run: go test -run XXX -fuzz '^${{ matrix.target }}$' -fuzztime 10m ${{ matrix.package }}
      # A crasher is written into testdata/fuzz, which is exactly what wants
      # keeping: it is the seed that reproduces the failure.
      - name: Keep whatever it found
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crashers-${{ matrix.target }}
          path: '**/testdata/fuzz/**'
